<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happie · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: #F0E7D6;
    background-image: radial-gradient(circle at 20% 18%, #FBF1DC 0%, transparent 42%), radial-gradient(circle at 84% 88%, #F5EAD3 0%, transparent 46%);
    display: grid; place-items: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #root { display: grid; place-items: center; padding: 24px; }
  input::placeholder { color: #B7AD9B; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* export mode: pin the phone top-left at native scale so a screenshot frames it tightly */
  html[data-export], html[data-export] body { height: auto; min-height: 0; display: block; background: #F0E7D6; }
  html[data-export] #root { display: block; padding: 0; }
  html[data-export] #root > div { width: max-content; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#FBF4E9"/>
    <path d="M68 22c10 24-1 37-9 44 2 7-6 8-9 5-9 3-27 3-40-10C2 51 9 35 28 25c16-9 32-12 40-3Z" fill="#FFC21E"/>
    <circle cx="42" cy="52" r="5" fill="#fff"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="happie-ui.jsx"></script>
<script type="text/babel" src="happie-screens.jsx"></script>
<script type="text/babel" src="happie-app.jsx"></script>
</body>
</html>
